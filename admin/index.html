<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administration — Let Padel Club</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1D3FA0">
  <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira:ital,wdth,wght@0,50..125,100..900;1,50..125,100..900&display=swap">
  <link rel="stylesheet" href="admin.css">
  <script type="module" src="admin.js"></script>
</head>
<body>
  <!-- Connexion -->
  <section class="login" id="login" hidden>
    <div class="login-card">
      <img src="https://kdcflcvufukagdjycwww.supabase.co/storage/v1/object/public/letpadel-media/site/principal/logo-lp.svg" alt="Let Padel Club" class="login-logo" width="140" height="68">
      <h1>Espace administration</h1>
      <form id="loginForm" class="stack">
        <label class="f"><span>E-mail</span><input type="email" name="email" autocomplete="username" required></label>
        <label class="f"><span>Mot de passe</span><input type="password" name="password" autocomplete="current-password" required></label>
        <button class="b b-primary" type="submit">Se connecter</button>
        <button class="b b-link" type="button" id="forgotBtn">Mot de passe oublié ?</button>
        <p class="msg" id="loginMsg" role="status" aria-live="polite"></p>
      </form>
      <form id="resetForm" class="stack" hidden>
        <p>Choisissez votre nouveau mot de passe.</p>
        <label class="f"><span>Nouveau mot de passe (8 caractères min.)</span><input type="password" name="password" minlength="8" autocomplete="new-password" required></label>
        <button class="b b-primary" type="submit">Enregistrer le mot de passe</button>
        <p class="msg" id="resetMsg" role="status" aria-live="polite"></p>
      </form>
      <p class="login-back"><a href="../index.html">Retour au site</a></p>
    </div>
  </section>

  <!-- Application -->
  <div class="app" id="app" hidden>
    <aside class="side" id="side">
      <a class="side-brand" href="../index.html" target="_blank" rel="noopener" title="Voir le site">
        <img src="https://kdcflcvufukagdjycwww.supabase.co/storage/v1/object/public/letpadel-media/site/principal/logo-lp-blanc.svg" alt="Let Padel Club" width="96" height="47">
      </a>
      <nav id="sideNav" aria-label="Sections de l'administration"></nav>
      <div class="side-foot">
        <span id="whoami"></span>
        <button class="b b-ghost b-sm" id="logoutBtn" type="button">Se déconnecter</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="b b-ghost b-sm menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
        <h1 id="viewTitle">Tableau de bord</h1>
        <a class="b b-ghost b-sm" href="../index.html" target="_blank" rel="noopener">Voir le site</a>
      </header>
      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog class="modal" id="modal"></dialog>
</body>
</html>
